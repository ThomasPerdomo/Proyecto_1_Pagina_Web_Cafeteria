<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>{{ datos.negocio.nombre }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='comida.css') }}">
    </head>

    <body>
        <div class="menu_comida">
            {% for producto in datos.menu.categorias[3].productos_comida %}
                <div id="{{ producto.id }}">
                    <h3>{{ producto.nombre }}</h3>
                    <p>{{ producto.descripcion }}</p>
                    <p>${{ producto.precio }}</p>
                </div>
            {% endfor %}
        </div>

        <img id="calentado" src="/static/images/calentado.png" alt="Calentado">
        <img id="arepas" src="/static/images/arepas.png" alt="Arepas">
        <img id="huevos" src="/static/images/huevos.png" alt="Huevos">
        <img id="sandwich" src="/static/images/sandwich.png" alt="Sandwich">

        <a href="/menu" class="boton_menu">Volver al menu</a>
        <a href="/" class="boton_inicio">Volver al inicio</a>

        <div class="logo">
            <h1>{{datos.negocio.nombre}}</h1>  
            <p>{{datos.negocio.slogan}}</p>
        </div>

        <p id = valores>{{datos.negocio.valores}}</p> 
        
    </body>

</html>
