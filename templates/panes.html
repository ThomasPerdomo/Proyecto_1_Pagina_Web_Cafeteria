<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>{{ datos.negocio.nombre }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='panes.css') }}">
    </head>

    <body>
        <div class="menu_panes">
            {% for producto in datos.menu.categorias[2].productos_panes %}
                <div id="{{ producto.id }}">
                    <h3>{{ producto.nombre }}</h3>
                    <p>{{ producto.descripcion }}</p>
                    <p>${{ producto.precio }}</p>
                </div>
            {% endfor %}
        </div>

        <img id="pandebono" src="/static/images/pandebono.png" alt="Pandebono">
        <img id="croissant" src="/static/images/croissant.png" alt="Criossant">
        <img id="brownie" src="/static/images/brownie.png" alt="Brownie">

        <a href="/menu" class="boton_menu">Volver al menu</a>
        <a href="/" class="boton_inicio">Volver al inicio</a>

        <div class="logo">
            <h1>{{datos.negocio.nombre}}</h1>  
            <p>{{datos.negocio.slogan}}</p>
        </div>

        <p id = valores>{{datos.negocio.valores}}</p> 
        
    </body>

</html>
